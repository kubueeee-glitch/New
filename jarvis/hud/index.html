<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Jarvis HUD</title>
<style>
  :root{--bg:#0b0e14;--card:#131826;--line:#1f2637;--txt:#dbe2f4;--dim:#7d879f;
        --ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--acc:#60a5fa}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--txt);font:14px/1.45 system-ui,Segoe UI,sans-serif;padding:16px}
  h1{font-size:15px;letter-spacing:.14em;color:var(--dim);margin-bottom:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
  .k{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
  .v{font-size:26px;font-weight:600;margin-top:2px}
  .v small{font-size:13px;color:var(--dim);font-weight:400}
  .bar{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--acc)}
  .cols{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
  .cols .card{min-height:220px;max-height:340px;overflow-y:auto}
  .row{padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
  .row:last-child{border:none}
  .t{color:var(--dim);font-size:11px;margin-right:6px}
  .ja{color:var(--acc)} .jarvis{color:var(--ok)}
  .st-done{color:var(--ok)} .st-running{color:var(--warn)} .st-error{color:var(--bad)} .st-queued{color:var(--dim)}
  #mode{text-transform:uppercase}
  .mode-sleep #mode{color:var(--dim)} .mode-listen #mode{color:var(--acc)}
  .mode-active #mode{color:var(--ok)} .mode-gaming #mode{color:var(--warn)}
  #dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-right:8px}
  #dot.on{background:var(--ok)}
</style>
</head>
<body>
<h1><span id="dot"></span>JARVIS — HUD</h1>
<div class="grid">
  <div class="card"><div class="k">tryb</div><div class="v" id="mode">—</div></div>
  <div class="card"><div class="k">VRAM (limit 6800 MB)</div>
    <div class="v" id="vram">—</div><div class="bar"><i id="vrambar" style="width:0"></i></div></div>
  <div class="card"><div class="k">temperatura GPU</div><div class="v" id="temp">—</div></div>
  <div class="card"><div class="k">pobór mocy</div><div class="v" id="power">—</div></div>
  <div class="card"><div class="k">opóźnienie głosu (cel &lt;800 ms)</div><div class="v" id="lat">—</div></div>
</div>
<div class="cols">
  <div class="card"><div class="k">transkrypt</div><div id="transcript"></div></div>
  <div class="card"><div class="k">kolejka</div><div id="queue"></div></div>
  <div class="card"><div class="k">ostatnie akcje</div><div id="actions"></div></div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function render(s){
  document.body.className = 'mode-' + s.mode;
  $('mode').textContent = s.mode;
  const g = s.gpu || {};
  if (g.vram_used_mb != null){
    $('vram').innerHTML = g.vram_used_mb + ' <small>/ ' + g.vram_total_mb + ' MB</small>';
    const pct = Math.min(100, 100 * g.vram_used_mb / (g.vram_total_mb || 8192));
    const bar = $('vrambar'); bar.style.width = pct + '%';
    bar.style.background = g.vram_used_mb > 6800 ? 'var(--bad)' : 'var(--acc)';
  } else { $('vram').textContent = '—'; }
  $('temp').innerHTML = g.temp_c != null ? g.temp_c + ' <small>°C</small>' : '—';
  $('power').innerHTML = g.power_w != null ? g.power_w.toFixed(0) + ' <small>W</small>' : '—';
  $('lat').innerHTML = s.latency_ms != null ? s.latency_ms + ' <small>ms</small>' : '—';
  $('transcript').innerHTML = (s.transcript || []).map(m =>
    `<div class="row"><span class="t">${m.t}</span><b class="${m.role}">${m.role}:</b> ${esc(m.text)}</div>`
  ).join('');
  $('queue').innerHTML = (s.queue || []).slice().reverse().map(q =>
    `<div class="row">#${q.id} ${esc(q.name)} <span class="st-${q.status}">${q.status}</span>` +
    (q.summary ? `<div class="t">${esc(q.summary)}</div>` : '') + `</div>`
  ).join('') || '<div class="row t">pusto</div>';
  $('actions').innerHTML = (s.actions || []).slice().reverse().map(a =>
    `<div class="row"><span class="t">${a.t}</span>${esc(a.action)} <span class="t">${esc(a.status || '')}</span></div>`
  ).join('') || '<div class="row t">brak</div>';
  const tr = $('transcript'); tr.scrollTop = tr.scrollHeight;
}
function connect(){
  const ws = new WebSocket('ws://' + location.host + '/ws');
  ws.onopen = () => $('dot').classList.add('on');
  ws.onmessage = e => render(JSON.parse(e.data));
  ws.onclose = () => { $('dot').classList.remove('on'); setTimeout(connect, 2000); };
}
connect();
</script>
</body>
</html>
