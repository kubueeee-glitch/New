[project]
name = "jarvis"
version = "0.1.0"
description = "Lokalny asystent głosowy — RTX 3060 Ti / 32 GB / Windows"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
    "httpx>=0.27",
    # audio — wszystko na CPU
    "sounddevice>=0.4.6",
    "silero-vad>=5.1",
    "faster-whisper>=1.0",
    "kokoro>=0.9",
    "openwakeword>=0.6",
    # orkiestracja / HUD
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "websockets>=12.0",
    # tryby, watchdog, gaming-detect
    "psutil>=5.9",
    "nvidia-ml-py>=12.0",
    # wzrok (E8)
    "mss>=9.0",
    "pillow>=10.0",
    "rapidocr-onnxruntime>=1.3",
    'uiautomation>=2.0; sys_platform == "win32"',
    'pyttsx3>=2.90; sys_platform == "win32"',
]

[tool.uv]
package = false
